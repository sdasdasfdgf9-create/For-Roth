<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunh Tver Lg ii Tv</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .quiz-container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h2 {
            margin-bottom: 25px;
            font-size: 1.5rem;
            line-height: 1.4;
        }
         .btn-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }
        /* Setup Video Skrin Penuh */
        .fullscreen-video {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizBox">
        <h2 id="questionText">Loading Somnur...</h2>
        <div class="btn-column" id="answerButtons">
            </div>
    </div>

    <div class="fullscreen-video" id="videoContainer">
        <video id="prankVideo" preload="auto"></video>
    </div>

    <script>
        const questions = [
            {
                q: "Som Sur Ta Man Questions Te, Som Answer smos Jenh Pi Bsd Ban Ot?",
                a: ["Ban", "Ban Tah Youka😅😘"]
            },
            {
                q: "Rol Ngai Ng Nv Sl Nh Ot?",
                a: ["SL", "SL JMR HA"]
            },
            {
                q: "Rol Ngai Ng Mean Neak Tmey Hx Nv ROTH?",
                a: ["OT MEAN", "KJEL YK"]
            },
            {
                q: "Hehehe, Som Sl Vinh Ban Ot?",
                a: ["BAN TAH!", "KPERM HAS"]
            }
        ];

        const VIDEO_BIASA_FILE = "Memo.MP4";
        const JUMPSCARE_FILE    = "JS.MP4";

        const VOLUME_VIDEO_BIASA = 0.4;
        const VOLUME_JUMPSCARE   = 1.0;
        const MASA_TUNGGU = 1000; 

        let currentQuestionIndex = 0;

        const questionText = document.getElementById('questionText');
        const answerButtons = document.getElementById('answerButtons');
        const quizBox = document.getElementById('quizBox');
        const videoContainer = document.getElementById('videoContainer');
        const prankVideo = document.getElementById('prankVideo');

        function startQuiz() {
            currentQuestionIndex = 0;
            showQuestion(questions[currentQuestionIndex]);
        }

        function showQuestion(question) {
            questionText.innerText = question.q;
            answerButtons.innerHTML = ''; 
            
            question.a.forEach(answer => {
                const button = document.createElement('button');
                button.innerText = answer;
                button.addEventListener('click', () => nextQuestion());
                answerButtons.appendChild(button);
            });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion(questions[currentQuestionIndex]);
            } else {
                playPrankSequence();
            }
        }

        function playPrankSequence() {
            quizBox.style.display = 'none';
            videoContainer.style.display = 'block';

            // Mainkan video biasa dulu
            prankVideo.src = VIDEO_BIASA_FILE;
            prankVideo.volume = VOLUME_VIDEO_BIASA;
            prankVideo.play().catch(err => {
                console.log("Autoplay block handle: browser memerlukan klik user.");
            });
            setTimeout(() => {
                triggerJumpscare();
            }, MASA_TUNGGU); 
        }

        function triggerJumpscare() {
            prankVideo.src = JUMPSCARE_FILE;
            prankVideo.volume = VOLUME_JUMPSCARE;
            prankVideo.loop = true;
            prankVideo.play();
        }

        startQuiz();
    </script>
</body>
</html>
